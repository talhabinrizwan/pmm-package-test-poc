# Builds the nine systemd-capable OS images that the package-test matrix runs
# against, and publishes them to GHCR as multi-arch (amd64 + arm64) images.
#
# Every image is booted and checked BEFORE it is pushed, so a broken image never
# becomes :latest. Each OS publishes independently -- one broken OS leaves the
# other eight untouched, still pointing at last week's good image.
name: Build systemd test images

on:
  # Weekly. Off-the-hour on purpose: GitHub delays the flood of on-the-hour crons.
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/build-test-images.yml

# Least privilege by default; only the jobs that publish ask for more.
permissions:
  contents: read

# Never let two builds race on the staging tags.
concurrency:
  group: build-test-images
  cancel-in-progress: false

env:
  # Change this one line to move the images elsewhere (e.g. ghcr.io/perconalab).
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  # Resolved once so all 18 build jobs and the 9 manifest jobs agree on the date
  # tag, even if the run straddles midnight UTC.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing for the provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        # KEEP THE OS LIST IN SYNC with .github/workflows/pmm3-package-tests-matrix.yml
        os: [ol8, ol9, alma10, debian11, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
        arch: [amd64, arm64]
        include:
          # Per-OS settings, applied to both arches of that OS.
          # privileged: deb-family images boot fine unprivileged, but we boot them
          # here exactly as the test matrix boots them so this proves the real thing.
          - { os: ol8,        base: 'oraclelinux:8', family: rpm, privileged: false }
          - { os: ol9,        base: 'oraclelinux:9', family: rpm, privileged: false }
          - { os: alma10,     base: 'almalinux:10',  family: rpm, privileged: false }
          - { os: debian11,   base: 'debian:11',     family: deb, privileged: true }
          - { os: debian12,   base: 'debian:12',     family: deb, privileged: true }
          - { os: debian13,   base: 'debian:13',     family: deb, privileged: true }
          - { os: ubuntu2204, base: 'ubuntu:22.04',  family: deb, privileged: true }
          - { os: ubuntu2404, base: 'ubuntu:24.04',  family: deb, privileged: true }
          - { os: ubuntu2604, base: 'ubuntu:26.04',  family: deb, privileged: true }
          # Per-arch settings, applied to that arch of every OS. Both are native
          # runners -- no QEMU emulation anywhere.
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: |
          # sudo throughout: rootless podman and root podman keep separate image
          # stores, so a rootless build would be invisible to the root-run probe.
          sudo podman build \
            --file "docker/Dockerfile.${{ matrix.family }}" \
            --build-arg "BASE_IMAGE=${{ matrix.base }}" \
            --tag "staged:${{ matrix.os }}" \
            .

      - name: Boot it and verify systemd actually comes up
        env:
          PRIVILEGED: ${{ matrix.privileged }}
        run: |
          PRIV=""
          [ "$PRIVILEGED" = "true" ] && PRIV="--privileged"
          # shellcheck disable=SC2086
          sudo podman run -d --name probe --systemd=always $PRIV "staged:${{ matrix.os }}"

          sudo podman exec probe bash -c '
            for i in $(seq 1 90); do
              state=$(systemctl is-system-running 2>/dev/null)
              case "$state" in
                running|degraded) echo "systemd reached: $state (${i}s)"; exit 0 ;;
              esac
              sleep 1
            done
            echo "systemd never finished starting; last state: $state"
            systemctl list-jobs --no-pager
            exit 1'

          sudo podman exec probe ansible --version | head -1
          sudo podman exec probe sh -c '
            for tool in ip ps git wget sudo; do
              command -v "$tool" >/dev/null || { echo "missing tool: $tool"; exit 1; }
            done
            echo "test tooling present"'
          sudo podman rm -f probe

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push this arch to a staging tag
        id: push
        run: |
          # Staging tags are overwritten every run and are not meant for humans.
          # The durable artefacts are the multi-arch :<date> and :latest manifests
          # built in the next job, which reference digests rather than these tags.
          name="${IMAGE_REPO}/${{ matrix.os }}"
          sudo podman tag "staged:${{ matrix.os }}" "${name}:staging-${{ matrix.arch }}"
          sudo podman push --digestfile=digest.txt "${name}:staging-${{ matrix.arch }}"
          sudo chown "$(id -u)" digest.txt
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Joins each OS's two per-arch images into one multi-arch tag.
  # if: !cancelled() rather than the default success() so that a single broken OS
  # fails only its own manifest -- the other eight still publish.
  manifest:
    name: publish ${{ matrix.os }}
    needs: [prepare, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # KEEP IN SYNC with .github/workflows/pmm3-package-tests-matrix.yml
        os: [ol8, ol9, alma10, debian11, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GHCR_TOKEN"

      - name: Join amd64 + arm64 into one multi-arch image
        env:
          DATE: ${{ needs.prepare.outputs.date }}
        run: |
          # Registry-to-registry manifest merge; nothing is pulled to disk.
          # Fails loudly if either arch did not publish, which is the point.
          name="${IMAGE_REPO}/${{ matrix.os }}"
          docker buildx imagetools create \
            --tag "${name}:${DATE}" \
            --tag "${name}:latest" \
            "${name}:staging-amd64" \
            "${name}:staging-arm64"

          digest=$(docker buildx imagetools inspect "${name}:${DATE}" \
                     --format '{{ .Manifest.Digest }}')
          {
            echo "### \`${{ matrix.os }}\`"
            echo ''
            echo "- \`${name}:${DATE}\`"
            echo "- \`${name}:latest\`"
            echo "- digest \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
