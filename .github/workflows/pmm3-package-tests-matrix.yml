# The Jenkins pmm3-package-tests-matrix job, on GitHub Actions: 8 playbooks x 9
# operating systems = 72 cells, each on its own runner with its own PMM Server and
# its own systemd-capable client container.
#
# The playbook comes from percona/pmm-qa and runs unmodified. Everything
# OS-specific lives in the prebuilt images (see build-test-images.yml).
name: PMM package tests matrix

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system ("all" runs every OS)'
        type: choice
        default: all
        options:
          [all, ol8, ol9, alma10, debian11, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
      test:
        description: 'Playbook ("all" runs every test)'
        type: choice
        default: all
        options:
          - all
          - pmm3-client_integration
          - pmm3-client_integration_auth_config
          - pmm3-client_integration_auth_register
          - pmm3-client_integration_custom_path
          - pmm3-client_integration_custom_port
          - pmm3-client_integration_upgrade
          - pmm3-client_integration_upgrade_custom_path
          - pmm3-client_integration_upgrade_custom_port
      pmm_server_image:
        description: 'PMM Server image (Jenkins DOCKER_VERSION)'
        default: 'perconalab/pmm-server:3-dev-latest'
      install_repo:
        description: 'Client repo channel. The upgrade playbooks upgrade FROM release
          TO this, so they cannot pass when it is also "release".'
        type: choice
        default: experimental
        options: [experimental, testing, release]
      pmm_version:
        description: 'Version the playbook asserts. Must match what install_repo
          ships: release 3.9.0, experimental/testing 3.9.1.'
        default: '3.9.0'
      metrics_mode:
        description: 'Metrics mode (Jenkins METRICS_MODE)'
        type: choice
        default: auto
        options: [auto, push, pull]
      tarball:
        description: 'Client tarball link or FB-code. Empty installs from packages.'
        default: ''
      admin_password:
        description: 'PMM Server admin password'
        default: 'pmm3admin!'
      git_branch:
        description: 'Tag or branch of percona/pmm-qa'
        default: 'main'
      client_image_tag:
        description: 'Prebuilt image tag. Use a YYYY-MM-DD tag to roll back.'
        default: 'latest'

permissions:
  contents: read

env:
  CLIENT_IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  # Pulling pmm-server once and re-hosting it keeps a 72-cell run to a single
  # Docker Hub pull (the anonymous limit is 100 per 6h, shared across runners) and
  # pins every cell to the same build even when the tag moves.
  prepare:
    name: mirror pmm-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server_image: ${{ steps.mirror.outputs.image }}
    steps:
      - name: Mirror pmm-server and write the run header
        id: mirror
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SOURCE: ${{ inputs.pmm_server_image }}
          DEST: ghcr.io/${{ github.repository }}/pmm-server:run-${{ github.run_id }}
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${SOURCE}")
          skopeo copy --retry-times 3 --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            "docker://${SOURCE}" "docker://${DEST}"
          echo "image=${DEST}" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## PMM package tests matrix

          | setting | value |
          |---|---|
          | pmm-server | \`${SOURCE}\` |
          | resolved digest | \`${digest}\` |
          | install_repo | \`${{ inputs.install_repo }}\` |
          | pmm_version | \`${{ inputs.pmm_version }}\` |
          | metrics_mode | \`${{ inputs.metrics_mode }}\` |
          | pmm-qa branch | \`${{ inputs.git_branch }}\` |
          | client images | \`${{ inputs.client_image_tag }}\` |
          EOF

  test:
    name: ${{ matrix.os }} / ${{ matrix.test }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90 # same as the Jenkins job
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Keep the OS list in sync with build-test-images.yml.
        # The continuation lines must keep this indentation: YAML only folds a >-
        # block onto one line while every line shares the same indent.
        os: >-
          ${{ fromJSON(inputs.os == 'all'
          && '["ol8","ol9","alma10","debian11","debian12","debian13","ubuntu2204","ubuntu2404","ubuntu2604"]'
          || format('["{0}"]', inputs.os)) }}
        test: >-
          ${{ fromJSON(inputs.test == 'all'
          && '["pmm3-client_integration","pmm3-client_integration_auth_config","pmm3-client_integration_auth_register","pmm3-client_integration_custom_path","pmm3-client_integration_custom_port","pmm3-client_integration_upgrade","pmm3-client_integration_upgrade_custom_path","pmm3-client_integration_upgrade_custom_port"]'
          || format('["{0}"]', inputs.test)) }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      # Runners come with MySQL installed, and AppArmor matches profiles by binary
      # path -- so the host profile also confines the mysqld in our container and
      # stops it writing its log. The playbook reads the temporary root password
      # from that log, so without this MySQL quietly ends up with no password.
      - name: Unload the host mysqld AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld && echo "unloaded"
          else
            echo "nothing to unload"
          fi

      - name: Start the ${{ matrix.os }} client
        id: client
        env:
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE_REPO }}/${{ matrix.os }}:${{ inputs.client_image_tag }}
          OS: ${{ matrix.os }}
        run: |
          # Hardened units (valkey-server, mysqlrouter, alma10's valkey@default)
          # need a private mount namespace. CAP_SYS_ADMIN on its own is not enough.
          # Oracle Linux does not need this and breaks under it, so it stays out.
          NEEDS_PRIVILEGED="alma10 debian11 debian12 debian13 ubuntu2204 ubuntu2404 ubuntu2604"
          PRIV=""
          case " $NEEDS_PRIVILEGED " in *" $OS "*) PRIV="--privileged" ;; esac

          # Not --network host: PMM checks for a Nomad node whose address is not
          # 127.0.0.1, so the client needs an address of its own.
          # shellcheck disable=SC2086
          sudo podman run -d --name client --systemd=always $PRIV "$CLIENT_IMAGE" /sbin/init

          sudo podman exec client bash -c '
            for i in $(seq 1 90); do
              case "$(systemctl is-system-running 2>/dev/null)" in
                running|degraded) echo "systemd up after ${i}s"; exit 0 ;;
              esac
              sleep 1
            done
            echo "systemd never came up"; systemctl list-jobs --no-pager; exit 1'

          # The bridge gateway is the runner, where pmm-server publishes its ports.
          gateway=$(sudo podman exec client ip route | awk '/^default/{print $3}')
          [ -n "$gateway" ] || { echo "client has no default route"; exit 1; }
          echo "pmm-server will be reachable at ${gateway}:443"
          echo "gateway=${gateway}" >> "$GITHUB_OUTPUT"

      # Nomad turns on cgroup controllers at the container's cgroup root, and
      # cgroup v2 refuses that while any process sits directly in it. A few systemd
      # builds leave one or two there, and Nomad then exits with "cgroups are not
      # writable". Moving them into a child cgroup is a no-op when the root is empty.
      - name: Free up the cgroup root for Nomad
        run: |
          sudo podman exec client sh -c '
            if [ "$(wc -l < /sys/fs/cgroup/cgroup.procs)" -gt 0 ]; then
              mkdir -p /sys/fs/cgroup/init
              while read -r pid; do
                echo "$pid" > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
              done < /sys/fs/cgroup/cgroup.procs
            fi
            left=$(wc -l < /sys/fs/cgroup/cgroup.procs)
            echo "processes left at the cgroup root: $left"
            [ "$left" -eq 0 ] || echo "WARNING: Nomad will fail to start"' || true

      # Started after the client because PMM_PUBLIC_ADDRESS has to be an address the
      # client can reach -- 127.0.0.1 would point it back at itself. Nomad also stays
      # switched off unless PMM_PUBLIC_ADDRESS is set (PMM-14921).
      - name: Start PMM Server
        env:
          SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          GATEWAY: ${{ steps.client.outputs.gateway }}
        run: |
          docker run -d --name pmm-server \
            -p 80:8080 -p 443:8443 -p 9000:9000 -p 4647:4647 \
            --volume pmm-data:/srv \
            -e GF_SECURITY_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e PMM_ENABLE_TELEMETRY=0 \
            -e PMM_DATA_RETENTION=48h \
            -e PMM_ENABLE_NOMAD=1 \
            -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
            -e PMM_PUBLIC_ADDRESS="$GATEWAY" \
            "$SERVER_IMAGE"

      # readyz goes green before Nomad is listening, and the playbook only retries a
      # few times before giving up on it. 502 means Nomad is not up yet.
      - name: Wait for PMM Server and its Nomad listener
        env:
          GATEWAY: ${{ steps.client.outputs.gateway }}
        run: |
          curl -ksf --retry 60 --retry-delay 5 --retry-all-errors \
            https://127.0.0.1/v1/server/readyz

          for _ in $(seq 1 60); do
            code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1/nomad/v1/nodes || echo 000)
            case "$code" in 502|504|000) sleep 5 ;; *) break ;; esac
          done
          if [ "${code:-502}" = "502" ]; then
            docker logs pmm-server --tail 50 || true
            echo "Nomad never started listening"; exit 1
          fi
          echo "Nomad is listening (HTTP $code)"

          # Check the client can actually get there; a wrong public address breaks it.
          sudo podman exec client bash -c "timeout 5 bash -c '</dev/tcp/${GATEWAY}/4647'"

      - name: Check out percona/pmm-qa in the client
        env:
          GIT_BRANCH: ${{ inputs.git_branch }}
        run: |
          sudo podman exec client git clone --depth 1 --branch "$GIT_BRANCH" \
            https://github.com/percona/pmm-qa /root/pmm-qa

      - name: Run ${{ matrix.test }}
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          INSTALL_REPO: ${{ inputs.install_repo }}
          METRICS_MODE: ${{ inputs.metrics_mode }}
          PMM_VERSION: ${{ inputs.pmm_version }}
          TARBALL_LINK: ${{ inputs.tarball }}
          SERVER_ADDR: ${{ steps.client.outputs.gateway }}:443
          # Percona Server has no AlmaLinux 10 release build yet. Empty elsewhere,
          # which leaves the playbook on its own default.
          PS_REPOSITORY: ${{ matrix.os == 'alma10' && 'testing' || '' }}
        run: |
          set -o pipefail
          # Same invocation as Jenkins. DEBIAN_FRONTEND and friends are baked into
          # the deb images, so apt cannot stop and wait for input.
          sudo podman exec \
            -e PMM_SERVER_IP="$SERVER_ADDR" \
            -e PS_REPOSITORY="$PS_REPOSITORY" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e install_repo="$INSTALL_REPO" \
            -e METRICS_MODE="$METRICS_MODE" \
            -e PMM_VERSION="$PMM_VERSION" \
            -e TARBALL_LINK="$TARBALL_LINK" \
            -w /root/pmm-qa \
            client \
            bash -c '
              # podman exec drops us in the cgroup root, which would undo the step
              # above, so move into a child cgroup before starting anything.
              mkdir -p /sys/fs/cgroup/ansible 2>/dev/null &&
                echo $$ > /sys/fs/cgroup/ansible/cgroup.procs 2>/dev/null || true
              exec ansible-playbook -vvv --connection=local \
                --inventory 127.0.0.1, --limit 127.0.0.1 \
                "package_tests/${{ matrix.test }}.yml"' 2>&1 | tee ansible.log

      - name: Collect diagnostics
        if: failure()
        run: |
          {
            echo "===== pmm-server ====="; docker logs pmm-server --tail 200 2>&1
            echo "===== pmm-admin status ====="; sudo podman exec client pmm-admin status 2>&1
            echo "===== failed units ====="; sudo podman exec client systemctl --failed --no-pager 2>&1
            echo "===== client journal ====="; sudo podman exec client journalctl --no-pager -n 300 2>&1
          } > diagnostics.log || true
          tail -80 diagnostics.log

      - name: Record the result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "${{ matrix.os }}|${{ matrix.test }}|${RESULT}" > "result-${{ matrix.os }}-${{ matrix.test }}.txt"

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.os }}-${{ matrix.test }}
          path: result-${{ matrix.os }}-${{ matrix.test }}.txt
          retention-days: 7

      # ansible -vvv is far too big to read in the browser and is exactly what you
      # want when something fails.
      - name: Upload logs from a failed cell
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.os }}-${{ matrix.test }}
          path: |
            ansible.log
            diagnostics.log
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          sudo podman rm -f client || true
          docker rm -f pmm-server || true

  report:
    name: summary
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # If every cell died before reporting there is nothing to download; let the
        # next step say so rather than failing here.
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Render the results grid
        run: |
          declare -A result
          for f in results/*.txt; do
            [ -e "$f" ] || continue
            IFS='|' read -r os test status < "$f"
            result["$os/$test"]=$status
          done

          if [ ${#result[@]} -eq 0 ]; then
            echo 'No results were produced -- every cell failed before reporting.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          all_os="ol8 ol9 alma10 debian11 debian12 debian13 ubuntu2204 ubuntu2404 ubuntu2604"
          all_tests="pmm3-client_integration pmm3-client_integration_auth_config
                     pmm3-client_integration_auth_register pmm3-client_integration_custom_path
                     pmm3-client_integration_custom_port pmm3-client_integration_upgrade
                     pmm3-client_integration_upgrade_custom_path pmm3-client_integration_upgrade_custom_port"

          # Only show the rows and columns that ran, so a filtered run stays small.
          ran_os()   { for k in "${!result[@]}"; do [ "${k%%/*}" = "$1" ] && return 0; done; return 1; }
          ran_test() { for k in "${!result[@]}"; do [ "${k#*/}"  = "$1" ] && return 0; done; return 1; }

          header="| OS |"; divider="|---|"
          for t in $all_tests; do
            ran_test "$t" || continue
            header+=" ${t#pmm3-client_} |"
            divider+="---|"
          done

          passed=0; failed=0; skipped=0; body=""
          for os in $all_os; do
            ran_os "$os" || continue
            row="| \`$os\` |"
            for t in $all_tests; do
              ran_test "$t" || continue
              case "${result[$os/$t]:-}" in
                success) row+=" ✅ |"; passed=$((passed + 1)) ;;
                failure) row+=" ❌ |"; failed=$((failed + 1)) ;;
                *)       row+=" · |";  skipped=$((skipped + 1)) ;;
              esac
            done
            body+="$row"$'\n'
          done

          # if/fi rather than `test && echo`: a trailing false would fail the step.
          note=''
          if [ "$skipped" -gt 0 ]; then note=", ${skipped} not run"; fi

          {
            printf '\n### Results\n\n%s\n%s\n%s\n' "$header" "$divider" "$body"
            echo "**${passed} passed, ${failed} failed${note}**"
            if [ "$failed" -gt 0 ]; then
              echo ''
              # shellcheck disable=SC2016  # backticks are markdown, not a subshell
              echo 'Failed cells attach their logs as `logs-<os>-<test>` artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ]
