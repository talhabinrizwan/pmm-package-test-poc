# Full replication of the Jenkins pmm3-package-tests-matrix job on GitHub Actions.
#
# Jenkins runs 8 test playbooks x 9 operating systems. Here that is 72 independent
# cells, each on its own runner with its own PMM Server and its own systemd-capable
# client container -- the same fresh-VM-per-pair isolation Jenkins gets.
#
# The playbook is cloned from percona/pmm-qa and run BYTE-FOR-BYTE as Jenkins runs
# it. Everything OS-specific lives in the prebuilt client images (built by
# build-test-images.yml), never in the playbook.
#
# The older 3-OS package-test-matrix.yml is kept alongside this as a known-good
# reference; this workflow supersedes it once all 72 cells are green.
name: PMM package tests matrix

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to test ("all" runs every OS)'
        type: choice
        default: all
        options:
          [all, ol8, ol9, alma10, debian11, debian12, debian13, ubuntu2204, ubuntu2404, ubuntu2604]
      test:
        description: 'Playbook to run ("all" runs every test)'
        type: choice
        default: all
        options:
          - all
          - pmm3-client_integration
          - pmm3-client_integration_auth_config
          - pmm3-client_integration_auth_register
          - pmm3-client_integration_custom_path
          - pmm3-client_integration_custom_port
          - pmm3-client_integration_upgrade
          - pmm3-client_integration_upgrade_custom_path
          - pmm3-client_integration_upgrade_custom_port
      pmm_server_image:
        description: 'PMM Server image (Jenkins DOCKER_VERSION)'
        default: 'perconalab/pmm-server:3-dev-latest'
      install_repo:
        description: 'Percona repo channel for the client (Jenkins INSTALL_REPO)'
        type: choice
        default: experimental
        options: [experimental, testing, release]
      pmm_version:
        description: 'Expected client version, asserted by the playbook (Jenkins PMM_VERSION).
          Must match what install_repo actually ships, exactly as in Jenkins.'
        default: '3.9.0'
      metrics_mode:
        description: 'Metrics mode (Jenkins METRICS_MODE)'
        type: choice
        default: auto
        options: [auto, push, pull]
      tarball:
        description: 'PMM Client tarball link or FB-code (Jenkins TARBALL). Empty = install from packages.'
        default: ''
      admin_password:
        description: 'PMM Server admin password (Jenkins ADMIN_PASSWORD)'
        default: 'pmm3admin!'
      git_branch:
        description: 'Tag/branch of percona/pmm-qa (Jenkins GIT_BRANCH)'
        default: 'main'
      client_image_tag:
        description: 'Tag of the prebuilt client images. Use a YYYY-MM-DD tag to roll back.'
        default: 'latest'

permissions:
  contents: read

env:
  CLIENT_IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  # Copies PMM Server from Docker Hub into GHCR exactly once per run.
  #
  # Two reasons, both real: a 72-cell run would otherwise cost 72 Docker Hub pulls
  # against a 100-per-6h limit shared across every GitHub runner on that IP; and
  # pinning one digest means all 72 cells test the SAME server build, which a
  # moving tag like 3-dev-latest would not otherwise guarantee.
  prepare:
    name: mirror pmm-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server_image: ${{ steps.mirror.outputs.image }}
      source_digest: ${{ steps.mirror.outputs.digest }}
    steps:
      - name: Mirror PMM Server into GHCR
        id: mirror
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SOURCE: ${{ inputs.pmm_server_image }}
          DEST: ghcr.io/${{ github.repository }}/pmm-server:run-${{ github.run_id }}
        run: |
          digest=$(skopeo inspect --format '{{.Digest}}' "docker://${SOURCE}")
          skopeo copy --retry-times 3 \
            --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            "docker://${SOURCE}" "docker://${DEST}"
          echo "image=${DEST}"    >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Write run header
        env:
          SOURCE: ${{ inputs.pmm_server_image }}
          DIGEST: ${{ steps.mirror.outputs.digest }}
        run: |
          {
            echo "## PMM package tests matrix"
            echo ''
            echo "| setting | value |"
            echo "|---|---|"
            echo "| pmm-server | \`${SOURCE}\` |"
            echo "| resolved digest | \`${DIGEST}\` |"
            echo "| install_repo | \`${{ inputs.install_repo }}\` |"
            echo "| pmm_version | \`${{ inputs.pmm_version }}\` |"
            echo "| metrics_mode | \`${{ inputs.metrics_mode }}\` |"
            echo "| pmm-qa branch | \`${{ inputs.git_branch }}\` |"
            echo "| client images | \`${{ inputs.client_image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.os }} / ${{ matrix.test }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90 # same as the Jenkins job
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # "all" -> every OS/test; otherwise just the one picked in the Run dialog.
        #
        # KEEP THE OS LIST IN SYNC with .github/workflows/build-test-images.yml
        #
        # Continuation lines MUST stay at this exact indentation: YAML folds a >-
        # block into one line only while lines share the base indent. Indent them
        # further and the newlines survive into the expression.
        os: >-
          ${{ fromJSON(inputs.os == 'all'
          && '["ol8","ol9","alma10","debian11","debian12","debian13","ubuntu2204","ubuntu2404","ubuntu2604"]'
          || format('["{0}"]', inputs.os)) }}
        test: >-
          ${{ fromJSON(inputs.test == 'all'
          && '["pmm3-client_integration","pmm3-client_integration_auth_config","pmm3-client_integration_auth_register","pmm3-client_integration_custom_path","pmm3-client_integration_custom_port","pmm3-client_integration_upgrade","pmm3-client_integration_upgrade_custom_path","pmm3-client_integration_upgrade_custom_port"]'
          || format('["{0}"]', inputs.test)) }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          echo "$GHCR_TOKEN" | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      # GitHub runners ship MySQL, so the host AppArmor policy carries a profile
      # for /usr/sbin/mysqld. AppArmor attaches profiles by binary path, so it
      # also confines the mysqld running INSIDE our container: the journal shows
      #   apparmor="DENIED" profile="/usr/sbin/mysqld" name=".../errmsg.sys"
      # mysqld then cannot write /var/log/mysqld.log, so the playbook's
      # temporary-password grep returns nothing, the root password is silently
      # never set, and `pmm-admin add mysql` fails with "Access denied" 25 tasks
      # later. Under --privileged podman drops the container profile, which is
      # what lets the host one take over -- the real cause of the long-standing
      # "privileged breaks pmm-admin add mysql" behaviour on RHEL-family legs.
      - name: Unload the runner's mysqld AppArmor profile
        run: |
          if [ -f /etc/apparmor.d/usr.sbin.mysqld ]; then
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld && echo "profile unloaded"
          else
            echo "no host mysqld profile present"
          fi
          sudo aa-status 2>/dev/null | grep -c mysqld || true

      - name: Start the ${{ matrix.os }} client container
        id: client
        env:
          CLIENT_IMAGE: ${{ env.CLIENT_IMAGE_REPO }}/${{ matrix.os }}:${{ inputs.client_image_tag }}
          OS: ${{ matrix.os }}
        run: |
          # Only the deb family needs --privileged: its hardened units
          # (valkey-server, mysqlrouter) require a private mount namespace.
          # It stays scoped -- granting it to the RHEL legs too reproducibly
          # broke `pmm-admin add mysql` there.
          #
          # CAP_SYS_ADMIN alone was tried instead and was strictly worse: every
          # deb leg failed, including debian11 which is otherwise reliable.
          # Three groups, each for a measured reason:
          #
          # deb family  --privileged. Their hardened units (valkey-server,
          #             mysqlrouter) need a private mount namespace; CAP_SYS_ADMIN
          #             alone leaves them failing with 226/NAMESPACE.
          # alma10      CAP_SYS_ADMIN only. Its valkey@default unit asks for exactly
          #             that ("Failed to keep CAP_SYS_ADMIN", status=217/USER), but
          #             full --privileged breaks `pmm-admin add mysql` with
          #             "Access denied for user 'root'@'localhost'" -- the same
          #             regression already documented on Oracle Linux.
          # ol8, ol9    nothing. They need neither, and --privileged breaks mysql.
          NEEDS_PRIVILEGED="debian11 debian12 debian13 ubuntu2204 ubuntu2404 ubuntu2604"
          PRIV=""
          case " $NEEDS_PRIVILEGED " in *" $OS "*) PRIV="--privileged" ;; esac
          # alma10 needs the same treatment as the deb family: its valkey@default
          # unit fails with "Failed to keep CAP_SYS_ADMIN" / status=217/USER
          # otherwise. --cap-add SYS_ADMIN on its own is NOT a substitute here --
          # with or without seccomp=unconfined it kills the container at startup
          # (exit 137), so it gets the full flag like the deb legs do.
          [ "$OS" = "alma10" ] && PRIV="--privileged"

          # Deliberately NOT --network host. PMM asserts that a Nomad node exists
          # whose Address is not 127.0.0.1, so the client must have its own address
          # distinct from the server's local node. Percona's own CI gets this from a
          # libvirt VM on 192.168.122.x talking to the server on the bridge gateway;
          # a podman bridge gives the identical shape for free.
          # shellcheck disable=SC2086
          sudo podman run -d --name client --systemd=always $PRIV \
            "$CLIENT_IMAGE" /sbin/init

          sudo podman exec client bash -c '
            for i in $(seq 1 90); do
              case "$(systemctl is-system-running 2>/dev/null)" in
                running|degraded) echo "systemd up (${i}s)"; exit 0 ;;
              esac
              sleep 1
            done
            echo "client systemd never finished starting"; systemctl list-jobs --no-pager; exit 1'

          # The bridge gateway is the runner, where pmm-server publishes its ports.
          gateway=$(sudo podman exec client ip route | awk '/^default/{print $3}')
          if [ -z "$gateway" ]; then echo "no default route in the client"; exit 1; fi

          # This is the address the playbook registers with Nomad, so log it: an
          # empty or loopback value here is the cause of a later Nomad assertion.
          client_ip=$(sudo podman exec client sh -c \
            "ip route get 8.8.8.8 | awk -F'src ' 'NR==1{split(\$2,a,\" \");print a[1]}'" || true)
          echo "client address   : ${client_ip:-<unknown>}"
          echo "server reached at: ${gateway}:443"

          # PMM's Nomad agent enables cgroup controllers on the container's cgroup
          # root. cgroup v2 forbids that on any cgroup with processes sitting
          # directly in it, so Nomad exits with "cgroups are not writable" and the
          # playbook's Nomad assertion fails ~25 minutes later.
          #
          # Measured across all nine OSes, this predicted the result exactly:
          #   0 procs at the cgroup root -> ol8, ol9, debian11  passed
          #   2 procs at the cgroup root -> debian12/13, ubuntu2204/2404/2604 failed
          #
          # Some systemd builds leave a couple of processes in the root instead of
          # migrating them into init.scope. Move them into a child cgroup so the
          # root is delegatable. Harmless where the root is already empty.
          echo "::group::cgroup root"
          sudo podman exec client sh -c '
            before=$(wc -l < /sys/fs/cgroup/cgroup.procs)
            if [ "$before" -gt 0 ]; then
              mkdir -p /sys/fs/cgroup/init
              while read -r pid; do
                echo "$pid" > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
              done < /sys/fs/cgroup/cgroup.procs
            fi
            after=$(wc -l < /sys/fs/cgroup/cgroup.procs)
            echo "cgroup root procs: ${before} -> ${after}"
            [ "$after" -eq 0 ] && echo "cgroup root delegatable: Nomad can start" \
                               || echo "WARNING: cgroup root still occupied; Nomad will fail"' || true
          echo "::endgroup::"
          echo "gateway=${gateway}"          >> "$GITHUB_OUTPUT"
          echo "server_addr=${gateway}:443"  >> "$GITHUB_OUTPUT"

      # Started AFTER the client, because PMM_PUBLIC_ADDRESS has to be an address
      # the client can actually reach, and that is the podman bridge gateway --
      # which only exists once a container has been started on it.
      - name: Start PMM Server
        env:
          SERVER_IMAGE: ${{ needs.prepare.outputs.server_image }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          GATEWAY: ${{ steps.client.outputs.gateway }}
        run: |
          # PMM_ENABLE_NOMAD needs PMM_PUBLIC_ADDRESS as well, or PMM silently
          # skips starting Nomad (PMM 3.9.0 release notes, PMM-14921).
          #
          # It must NOT be 127.0.0.1 here. The client's Nomad agent dials the
          # address the server advertises, and from inside the client container
          # 127.0.0.1 is the client itself -- so nomad_agent sits at "Unspecified"
          # forever and the playbook's non-local-node assertion fails.
          docker run -d --name pmm-server \
            -p 80:8080 -p 443:8443 -p 9000:9000 -p 4647:4647 \
            --volume pmm-data:/srv \
            -e GF_SECURITY_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e PMM_ENABLE_TELEMETRY=0 \
            -e PMM_DATA_RETENTION=48h \
            -e PMM_ENABLE_NOMAD=1 \
            -e PMM_ENABLE_INTERNAL_PG_QAN=1 \
            -e PMM_PUBLIC_ADDRESS="$GATEWAY" \
            "$SERVER_IMAGE"

      - name: Wait for PMM Server to be ready
        run: |
          curl -ksf --retry 60 --retry-delay 5 --retry-all-errors \
            https://127.0.0.1/v1/server/readyz

      # readyz goes green before Nomad's listener is up, and the playbook only
      # retries `pmm-admin list` a handful of times before giving up -- which is
      # why nomad_agent intermittently sat at "Unspecified". Wait for the listener
      # here instead, so the client has something to register against immediately.
      # 502 = gateway up but Nomad not listening yet; 401 = listening.
      - name: Wait for the server's Nomad to be listening
        env:
          GATEWAY: ${{ steps.client.outputs.gateway }}
        run: |
          for i in $(seq 1 60); do
            code=$(curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1/nomad/v1/nodes || echo 000)
            case "$code" in
              502|000|504) sleep 5 ;;
              *) echo "nomad listener up after $((i*5))s (HTTP $code)"; break ;;
            esac
          done
          if [ "${code:-502}" = "502" ]; then
            echo "nomad never started listening on the server"
            docker logs pmm-server --tail 50 || true
            exit 1
          fi

          # And prove the client can actually reach it, since that is the leg that
          # a wrong PMM_PUBLIC_ADDRESS breaks.
          sudo podman exec client bash -c \
            "timeout 5 bash -c '</dev/tcp/${GATEWAY}/4647' && echo 'client can reach ${GATEWAY}:4647'"

      - name: Check out percona/pmm-qa inside the client
        env:
          GIT_BRANCH: ${{ inputs.git_branch }}
        run: |
          sudo podman exec client git clone --depth 1 --branch "$GIT_BRANCH" \
            https://github.com/percona/pmm-qa /root/pmm-qa

      - name: Run ${{ matrix.test }}
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          INSTALL_REPO: ${{ inputs.install_repo }}
          METRICS_MODE: ${{ inputs.metrics_mode }}
          PMM_VERSION: ${{ inputs.pmm_version }}
          TARBALL_LINK: ${{ inputs.tarball }}
          SERVER_ADDR: ${{ steps.client.outputs.server_addr }}
          # Percona Server has no AlmaLinux 10 release build yet; their own CI
          # sets this for ol-10 too. Empty everywhere else -> playbook default.
          PS_REPOSITORY: ${{ matrix.os == 'alma10' && 'testing' || '' }}
        run: |
          set -o pipefail
          # Same invocation Jenkins uses: --connection=local against 127.0.0.1.
          # DEBIAN_FRONTEND/NEEDRESTART_MODE/TZ are baked into the deb images and
          # inherited here, so the playbook's own apt-get calls cannot hang on a prompt.
          sudo podman exec \
            -e PMM_SERVER_IP="$SERVER_ADDR" \
            -e PS_REPOSITORY="$PS_REPOSITORY" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e install_repo="$INSTALL_REPO" \
            -e METRICS_MODE="$METRICS_MODE" \
            -e PMM_VERSION="$PMM_VERSION" \
            -e TARBALL_LINK="$TARBALL_LINK" \
            -w /root/pmm-qa \
            client \
            bash -c '
              # podman exec puts its session in the cgroup ROOT of the container,
              # and cgroup v2 then refuses to let Nomad enable controllers there
              # ("cgroups are not writable"). Move this shell -- and therefore
              # everything the playbook spawns -- into a child cgroup first, so the
              # root stays empty for the whole run rather than only at boot.
              mkdir -p /sys/fs/cgroup/ansible 2>/dev/null &&
                echo $$ > /sys/fs/cgroup/ansible/cgroup.procs 2>/dev/null || true
              exec ansible-playbook -vvv \
                --connection=local \
                --inventory 127.0.0.1, \
                --limit 127.0.0.1 \
                "package_tests/${{ matrix.test }}.yml"' 2>&1 | tee ansible.log

      - name: Collect diagnostics
        if: failure()
        run: |
          {
            echo "===== pmm-server logs ====="
            docker logs pmm-server --tail 200 2>&1 || true
            echo "===== pmm-admin status ====="
            sudo podman exec client pmm-admin status 2>&1 || true
            echo "===== failed units ====="
            sudo podman exec client systemctl --failed --no-pager 2>&1 || true
            echo "===== client journal ====="
            sudo podman exec client journalctl --no-pager -n 300 2>&1 || true
          } > diagnostics.log
          tail -80 diagnostics.log

      - name: Record cell result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "${{ matrix.os }}|${{ matrix.test }}|${RESULT}" > "result-${{ matrix.os }}-${{ matrix.test }}.txt"

      - name: Upload cell result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: result-${{ matrix.os }}-${{ matrix.test }}
          path: result-${{ matrix.os }}-${{ matrix.test }}.txt
          retention-days: 7

      # ansible -vvv is far too large to read in the web log viewer, and it is
      # exactly what you need to debug a failure.
      - name: Upload logs from the failed cell
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.os }}-${{ matrix.test }}
          path: |
            ansible.log
            diagnostics.log
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: |
          sudo podman rm -f client || true
          docker rm -f pmm-server || true

  report:
    name: summary
    needs: [prepare, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download cell results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # A run where every cell died before reporting leaves nothing to download.
        # Tolerated here so the next step can fail with a message that says so.
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: results

      - name: Render the matrix grid
        run: |
          declare -A RESULT SEEN_OS SEEN_TEST
          for f in results/*.txt; do
            [ -e "$f" ] || continue
            IFS='|' read -r os test status < "$f"
            RESULT["${os}/${test}"]="$status"
            SEEN_OS["$os"]=1
            SEEN_TEST["$test"]=1
          done

          if [ "${#RESULT[@]}" -eq 0 ]; then
            echo 'No cell results were produced -- every cell failed before reporting.' \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          OS_ORDER="ol8 ol9 alma10 debian11 debian12 debian13 ubuntu2204 ubuntu2404 ubuntu2604"
          TEST_ORDER="pmm3-client_integration \
                      pmm3-client_integration_auth_config \
                      pmm3-client_integration_auth_register \
                      pmm3-client_integration_custom_path \
                      pmm3-client_integration_custom_port \
                      pmm3-client_integration_upgrade \
                      pmm3-client_integration_upgrade_custom_path \
                      pmm3-client_integration_upgrade_custom_port"

          # Column headers: drop the shared prefix so the table stays readable.
          header="| OS |"; divider="|---|"
          for t in $TEST_ORDER; do
            [ -n "${SEEN_TEST[$t]:-}" ] || continue
            short="${t#pmm3-client_}"
            header="${header} ${short} |"; divider="${divider}---|"
          done

          pass=0; fail=0; other=0
          body=""
          for os in $OS_ORDER; do
            [ -n "${SEEN_OS[$os]:-}" ] || continue
            row="| \`${os}\` |"
            for t in $TEST_ORDER; do
              [ -n "${SEEN_TEST[$t]:-}" ] || continue
              key="${os}/${t}"
              case "${RESULT[$key]:-}" in
                success)   cell='✅'; pass=$((pass+1)) ;;
                failure)   cell='❌'; fail=$((fail+1)) ;;
                cancelled) cell='⏹️'; other=$((other+1)) ;;
                *)         cell='·';  other=$((other+1)) ;;
              esac
              row="${row} ${cell} |"
            done
            body="${body}${row}"$'\n'
          done

          # Written with if/fi rather than `cond && cmd`: under `set -e` a trailing
          # AND-list that evaluates false would fail this step on a fully green run.
          extra=''
          if [ "$other" -gt 0 ]; then extra=", ${other} not run"; fi

          {
            echo ''
            echo '### Results'
            echo ''
            echo "$header"
            echo "$divider"
            printf '%s' "$body"
            echo ''
            echo "**${pass} passed, ${fail} failed${extra}**"
            if [ "$fail" -gt 0 ]; then
              echo ''
              # shellcheck disable=SC2016  # backticks are markdown here, not a subshell
              echo 'Logs for each failed cell are attached as `logs-<os>-<test>` artifacts.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$fail" -eq 0 ]

  # Best effort: deleting package versions can require a PAT rather than
  # GITHUB_TOKEN, so this never fails the run. Worst case, old mirrors linger.
  prune-mirrors:
    name: prune old server mirrors
    needs: [prepare, test, report]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ github.repository_owner }}
          package-name: '${{ github.event.repository.name }}/pmm-server'
          package-type: container
          min-versions-to-keep: 3
